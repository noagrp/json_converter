<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Json Converter</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 1100px; margin: 0 auto; background: #f4f4f9; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #111; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .flex-row { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        .column { flex: 1; min-width: 350px; display: flex; flex-direction: column; }
        
        label { font-weight: bold; margin-bottom: 8px; display: block; }
        
        .drop-zone {
            position: relative;
            border: 2px dashed #007bff;
            border-radius: 6px;
            background-color: #f8fbff;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .drop-zone.drag-active {
            background-color: #e2efff;
            border-color: #0056b3;
            border-width: 3px;
        }
        
        textarea { 
            width: 100%; 
            height: 350px; 
            font-family: monospace; 
            padding: 15px; 
            box-sizing: border-box; 
            border: none; 
            resize: vertical; 
            white-space: pre; 
            background: transparent;
        }
        textarea:focus { outline: none; }
        
        #jsonOutput { border: 1px solid #ccc; border-radius: 6px; background-color: #fafafa; }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f5;
            padding: 10px 15px;
            border-top: 2px dashed #007bff;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .prefix-box { display: flex; align-items: center; gap: 8px; }
        .prefix-box input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; width: 140px;}

        .btn-group { display: flex; gap: 10px; }
        button { padding: 10px 16px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; color: white; transition: 0.2s; font-size: 14px; }
        .btn-blue { background-color: #007bff; } .btn-blue:hover { background-color: #0056b3; }
        .btn-green { background-color: #28a745; } .btn-green:hover { background-color: #218838; }
        
        input[type="file"] { display: none; }
        
        .status { margin-top: 20px; padding: 15px; border-radius: 4px; font-weight: 500; display: none; line-height: 1.5; font-size: 15px;}
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }

        /* --- Mobile Responsiveness Additions --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .column { min-width: 100%; } /* Overrides the 350px constraint */
            
            .controls { 
                flex-direction: column; 
                align-items: stretch; 
            }
            
            .prefix-box { width: 100%; }
            .prefix-box input { flex: 1; width: 100%; } /* Allows input to fill available space */
            
            .btn-group { 
                flex-direction: column; 
                width: 100%; 
            }
            .btn-group > div { width: 100%; }
            .btn-group button { width: 100%; }
            
            textarea { height: 250px; } /* Slightly shorter to prevent excessive scrolling on phones */
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Json Converter</h2>
        
        <div class="flex-row">
            <div class="column">
                <label>1. Input Data (CSV/TSV)</label>
                
                <div id="dropZone" class="drop-zone">
                    <textarea id="csvInput" placeholder="Drop a file here...&#10;Or paste your raw data..."></textarea>
                    
                    <div class="controls">
                        <div class="prefix-box">
                            <label for="idPrefix" style="margin:0; font-size: 14px;">ID Prefix:</label>
                            <input type="text" id="idPrefix" placeholder="e.g., ability_">
                        </div>
                        <div class="btn-group">
                            <div>
                                <input type="file" id="fileInput" accept=".csv, .tsv, .txt">
                                <button class="btn-green" onclick="document.getElementById('fileInput').click()">📁 Browse File</button>
                            </div>
                            <button class="btn-blue" onclick="processManualInput()">Parse & Convert ➔</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="column">
                <label>2. Workable JSON Output</label>
                <textarea id="jsonOutput" placeholder="Your perfectly structured JSON will appear here..." readonly></textarea>
            </div>
        </div>

        <div id="statusBox" class="status"></div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const csvInput = document.getElementById('csvInput');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) handleFile(files[0]);
        });

        fileInput.addEventListener('change', function(e) {
            if (this.files.length > 0) handleFile(this.files[0]);
            this.value = ''; 
        });

        function handleFile(file) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const text = e.target.result;
                csvInput.value = text;
                setStatus(`📄 File Loaded: <strong>${file.name}</strong>. Processing...`, 'success');
                
                setTimeout(() => {
                    executeConversion(text, file.name);
                }, 50);
            };
            
            reader.onerror = function() {
                setStatus("❌ Error: Could not read the file.", 'error');
            };
            
            reader.readAsText(file);
        }

        function setStatus(htmlContent, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.innerHTML = htmlContent;
            statusBox.className = 'status ' + type;
        }

        function processManualInput() {
            const rawData = csvInput.value.trim();
            executeConversion(rawData, "Manual Input");
        }

        function robustSmartParse(str) {
            const arr = [];
            let quote = false;
            let col = 0, row = 0;
            
            const firstLine = str.split('\n')[0];
            const tabCount = (firstLine.match(/\t/g) || []).length;
            const commaCount = (firstLine.match(/,/g) || []).length;
            const delimiter = tabCount > commaCount ? '\t' : ',';

            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                
                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === delimiter && !quote) { ++col; continue; } 
                if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if ((cc === '\n' || cc === '\r') && !quote) { ++row; col = 0; continue; }
                
                arr[row][col] += cc;
            }
            
            return {
                grid: arr.filter(row => row.join('').trim() !== ''),
                usedDelimiter: delimiter === '\t' ? 'Tabs' : 'Commas'
            };
        }

        function executeConversion(rawData, sourceName) {
            if (!rawData) {
                setStatus("❌ Input is empty. Please paste data or select a file.", "error");
                return;
            }

            try {
                const parseResult = robustSmartParse(rawData);
                const parsedGrid = parseResult.grid;
                
                if (parsedGrid.length < 2) {
                    setStatus("❌ Not enough data. Need at least a header row and one data row.", "error");
                    return;
                }

                const rawHeaders = parsedGrid[0];
                const headers = [];
                const headerTracker = {};

                // Get prefix from the input box
                const idPrefix = document.getElementById('idPrefix').value.trim();

                for (let i = 0; i < rawHeaders.length; i++) {
                    let h = rawHeaders[i].trim();
                    
                    if (h === "No" || h === "no" || h === "0") {
                        h = "id";
                    }
                    
                    if (!h) {
                        h = "Column_" + i; 
                    }
                    
                    if (headerTracker[h]) {
                        headerTracker[h]++;
                        h = h + "_" + headerTracker[h]; 
                    } else {
                        headerTracker[h] = 1;
                    }
                    
                    headers.push(h);
                }

                const result = [];
                for (let i = 1; i < parsedGrid.length; i++) {
                    const row = parsedGrid[i];
                    const obj = {};
                    const maxCols = Math.max(headers.length, row.length);
                    
                    for (let j = 0; j < maxCols; j++) {
                        let key = headers[j] || "Extra_Data_" + j;
                        let cellValue = row[j] !== undefined ? row[j].trim() : "";
                        
                        // Apply the prefix if this is the ID column
                        if (key === "id" && idPrefix !== "") {
                            cellValue = idPrefix + cellValue;
                        }
                        
                        obj[key] = cellValue;
                    }
                    result.push(obj);
                }

                document.getElementById('jsonOutput').value = JSON.stringify(result, null, 2);
                
                let statusMessage = `✅ <strong>Success (${sourceName}):</strong> Converted <strong>${result.length}</strong> valid entries.`;
                if (idPrefix) {
                    statusMessage += `<br><em>Applied ID prefix: "${idPrefix}"</em>`;
                }
                setStatus(statusMessage, "success");

            } catch (error) {
                setStatus(`❌ <strong>Error processing data:</strong> ${error.message}`, "error");
            }
        }
    </script>
</body>
</html>
