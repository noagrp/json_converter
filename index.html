<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>JSON Converter</title>
<link rel="manifest" href="./manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=2">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2">
<style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1f2937;--border:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#2563eb;--good:#059669;--danger:#b91c1c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:18px}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px}.top-actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:8px;background:#334155;color:#fff;padding:8px 10px;font-size:12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent)}.btn.good{background:var(--good)}.btn.danger{background:var(--danger)}.main{max-width:1280px;margin:auto;padding:14px}.toolbar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.field{display:grid;gap:4px}.field label{font-size:10px;color:var(--muted)}.field input,.field select{background:var(--panel2);border:1px solid var(--border);color:#fff;border-radius:8px;padding:8px}.grow{flex:1;min-width:150px}.switch{font-size:11px;color:#cbd5e1;display:flex;gap:6px;align-items:center}.mobile-tabs{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}.panel-title{font-size:13px;font-weight:800}.panel-meta{font-size:10px;color:var(--muted)}.panel-actions{display:flex;gap:6px;flex-wrap:wrap}.editor-wrap{position:relative}.drop-hint{position:absolute;inset:10px;pointer-events:none;border:1px dashed transparent;border-radius:8px}.editor-wrap.drag .drop-hint{border-color:#60a5fa;background:rgba(37,99,235,.08)}textarea{width:100%;min-height:520px;border:0;resize:vertical;background:#0b1220;color:#e5e7eb;padding:14px;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;line-height:1.45;white-space:pre}.status{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:12px;display:none}.status.ok{display:block;background:#052e24;color:#a7f3d0;border:1px solid #065f46}.status.err{display:block;background:#450a0a;color:#fecaca;border:1px solid #7f1d1d}.footnote{margin-top:8px;color:var(--muted);font-size:10px}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.mobile-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.mobile-tabs button{border:0;border-radius:8px;padding:9px;background:#334155;color:#fff;font-weight:700}.mobile-tabs button.active{background:var(--accent)}.grid.mobile-source .output-panel{display:none}.grid.mobile-output .source-panel{display:none}.brand p{display:none}.topbar{align-items:flex-start}.main{padding:10px}textarea{min-height:390px}}@media(max-width:520px){.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.toolbar .grow{min-width:0}.toolbar .wide,.toolbar .switch{grid-column:1/-1}.toolbar .switch{min-width:0;padding:2px 0}.toolbar .field,.toolbar .field input,.toolbar .field select{min-width:0;width:100%}.panel-head{align-items:flex-start;flex-direction:column}.panel-actions{width:100%}.panel-actions .btn{flex:1}.top-actions .secondary{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand"><h1>JSON Converter</h1><p>Convert tabular data and JSON locally</p></div><div class="top-actions"><button class="btn secondary" id="openBtn">Open File</button><input id="fileInput" type="file" accept=".csv,.tsv,.txt,.json,text/csv,text/tab-separated-values,application/json" hidden><button class="btn danger" id="clearBtn">Clear</button></div></header>
<main class="main">
<div class="toolbar">
<div class="field"><label>Mode</label><select id="mode"><option value="tableToJson">Table → JSON</option><option value="jsonToTable">JSON → Table</option></select></div>
<div class="field"><label>Delimiter</label><select id="delimiter"><option value="auto">Auto detect</option><option value=",">Comma ,</option><option value="\t">Tab</option><option value=";">Semicolon ;</option><option value="|">Pipe |</option></select></div>
<div class="field grow"><label>ID Prefix</label><input id="idPrefix" placeholder="Optional, e.g. ability_"></div>
<label class="switch"><input id="inferTypes" type="checkbox"> Smart value types</label>
<div class="field"><label>JSON Indent</label><select id="indent"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="0">Minified</option></select></div>
<button class="btn primary wide" id="convertBtn">Convert</button>
</div>
<div class="mobile-tabs"><button id="sourceTab" class="active">Source</button><button id="outputTab">Output</button></div>
<div class="grid mobile-source" id="grid">
<section class="panel source-panel"><div class="panel-head"><div><div class="panel-title" id="sourceTitle">CSV / TSV Input</div><div class="panel-meta" id="sourceMeta">Paste, type, or drop a file</div></div><div class="panel-actions"><button class="btn" id="formatSourceBtn">Format</button></div></div><div class="editor-wrap" id="sourceWrap"><textarea id="source" spellcheck="false" placeholder="Paste CSV / TSV here...\nOr drop a file onto this editor."></textarea><div class="drop-hint"></div></div></section>
<section class="panel output-panel"><div class="panel-head"><div><div class="panel-title" id="outputTitle">JSON Output</div><div class="panel-meta" id="outputMeta">Ready</div></div><div class="panel-actions"><button class="btn" id="copyBtn">Copy</button><button class="btn good" id="downloadBtn">Download</button></div></div><textarea id="output" spellcheck="false" readonly placeholder="Converted output appears here..."></textarea></section>
</div>
<div id="status" class="status"></div><div class="footnote">Everything runs locally in your browser. Current work is restored automatically on this device.</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id),KEY='json_converter_v2';let saveTimer=null,lastFilename='converted.json';
const source=$('source'),output=$('output');
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({v:2,source:source.value,output:output.value,mode:$('mode').value,delimiter:$('delimiter').value,idPrefix:$('idPrefix').value,infer:$('inferTypes').checked,indent:$('indent').value}))}catch{}},350)}
function restore(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return;$('mode').value=s.mode||'tableToJson';$('delimiter').value=s.delimiter||'auto';$('idPrefix').value=s.idPrefix||'';$('inferTypes').checked=!!s.infer;$('indent').value=s.indent??'2';source.value=s.source||'';output.value=s.output||''}catch{}}
function status(msg,type='ok'){const el=$('status');el.textContent=msg;el.className='status '+(type==='err'?'err':'ok')}
function clearStatus(){$('status').className='status';$('status').textContent=''}
function escapeCell(v,d){if(v===null||v===undefined)return'';let s=typeof v==='object'?JSON.stringify(v):String(v);if(s.includes('"'))s=s.replace(/"/g,'""');if(s.includes(d)||s.includes('\n')||s.includes('\r')||s.includes('"'))s='"'+s+'"';return s}
function detectDelimiter(text){const lines=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,8),candidates=[',','\t',';','|'];let best=',',score=-1;for(const d of candidates){let counts=lines.map(l=>countDelimiter(l,d));if(!counts.length)continue;const nonzero=counts.filter(n=>n>0);if(!nonzero.length)continue;const avg=nonzero.reduce((a,b)=>a+b,0)/nonzero.length,spread=Math.max(...nonzero)-Math.min(...nonzero),s=avg*10-spread;if(s>score){score=s;best=d}}return best}
function countDelimiter(line,d){let q=false,n=0;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){i++;continue}q=!q}else if(c===d&&!q)n++}return n}
function parseDelimited(str,delimiter){const d=delimiter==='auto'?detectDelimiter(str):delimiter;const rows=[];let row=[],cell='',q=false;for(let i=0;i<str.length;i++){const c=str[i],n=str[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===d&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()!==''))rows.push(row);row=[];continue}cell+=c}row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);if(q)throw new Error('Unclosed quoted field.');return{rows,delimiter:d}}
function infer(v){const s=v.trim();if(s==='')return'';if(/^null$/i.test(s))return null;if(/^true$/i.test(s))return true;if(/^false$/i.test(s))return false;if(/^-?(?:\d+|\d*\.\d+)(?:e[+-]?\d+)?$/i.test(s)&&!(s.length>1&&/^0\d+$/.test(s)))return Number(s);return v}
function headersFrom(row){const seen={};return row.map((raw,i)=>{let h=raw.trim();if(h==='No'||h==='no'||h==='0')h='id';if(!h)h='Column_'+(i+1);if(seen[h]){seen[h]++;h=h+'_'+seen[h]}else seen[h]=1;return h})}
function tableToJson(){const raw=source.value;if(!raw.trim())throw new Error('Input is empty.');const {rows,delimiter}=parseDelimited(raw,$('delimiter').value);if(rows.length<2)throw new Error('Need a header row and at least one data row.');const headers=headersFrom(rows[0]),prefix=$('idPrefix').value.trim(),typed=$('inferTypes').checked,result=[];for(let i=1;i<rows.length;i++){const row=rows[i],obj={};for(let j=0;j<Math.max(headers.length,row.length);j++){const key=headers[j]||('Extra_Data_'+(j+1));let val=(row[j]??'').trim();if(key==='id'&&prefix)val=prefix+val;obj[key]=typed?infer(val):val}result.push(obj)}const indent=+$('indent').value;output.value=JSON.stringify(result,null,indent||0);$('outputMeta').textContent=`${result.length} rows · ${delimiter==='\t'?'tab':delimiter} delimiter`;lastFilename='converted.json';status(`Converted ${result.length} rows to JSON.`)}
function normalizeObjects(data){if(Array.isArray(data))return data;if(data&&typeof data==='object')return[data];throw new Error('JSON must be an object or an array of objects.')}
function jsonToTable(){if(!source.value.trim())throw new Error('Input is empty.');let data;try{data=JSON.parse(source.value)}catch(e){throw new Error('Invalid JSON: '+e.message)}const rows=normalizeObjects(data);if(!rows.length){output.value='';$('outputMeta').textContent='0 rows';return}if(rows.some(r=>!r||typeof r!=='object'||Array.isArray(r)))throw new Error('JSON array must contain objects.');const keys=[];const seen=new Set();rows.forEach(r=>Object.keys(r).forEach(k=>{if(!seen.has(k)){seen.add(k);keys.push(k)}}));const selected=$('delimiter').value==='auto'?',':$('delimiter').value;const lines=[keys.map(k=>escapeCell(k,selected)).join(selected),...rows.map(r=>keys.map(k=>escapeCell(r[k],selected)).join(selected))];output.value=lines.join('\n');const ext=selected==='\t'?'tsv':'csv';lastFilename='converted.'+ext;$('outputMeta').textContent=`${rows.length} rows · ${keys.length} columns`;status(`Converted JSON to ${selected==='\t'?'TSV':'delimited text'}.`)}
function convert(){clearStatus();try{$('mode').value==='tableToJson'?tableToJson():jsonToTable();save()}catch(e){status(e.message||'Conversion failed.','err')}}
function updateMode(){const toJson=$('mode').value==='tableToJson';$('sourceTitle').textContent=toJson?'CSV / TSV Input':'JSON Input';$('outputTitle').textContent=toJson?'JSON Output':'CSV / TSV Output';source.placeholder=toJson?'Paste CSV / TSV here...\nOr drop a file onto this editor.':'Paste JSON here...\nOr drop a .json file onto this editor.';$('idPrefix').disabled=!toJson;$('inferTypes').disabled=!toJson;$('formatSourceBtn').classList.toggle('hidden',toJson);clearStatus();save()}
$('convertBtn').onclick=convert;$('mode').onchange=updateMode;['delimiter','idPrefix','inferTypes','indent'].forEach(id=>$(id).addEventListener('change',save));source.addEventListener('input',save);
$('formatSourceBtn').onclick=()=>{if($('mode').value!=='jsonToTable')return;try{const data=JSON.parse(source.value);source.value=JSON.stringify(data,null,2);status('JSON formatted.');save()}catch(e){status('Invalid JSON: '+e.message,'err')}};
$('copyBtn').onclick=async()=>{if(!output.value)return;try{await navigator.clipboard.writeText(output.value);$('copyBtn').textContent='Copied';setTimeout(()=>$('copyBtn').textContent='Copy',1100)}catch{const ta=document.createElement('textarea');ta.value=output.value;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}};
$('downloadBtn').onclick=()=>{if(!output.value)return;const type=lastFilename.endsWith('.json')?'application/json':'text/plain;charset=utf-8',url=URL.createObjectURL(new Blob([output.value],{type})),a=document.createElement('a');a.href=url;a.download=lastFilename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)};
$('clearBtn').onclick=()=>{if(!confirm('Clear the current input and output?'))return;source.value='';output.value='';clearStatus();try{localStorage.removeItem(KEY)}catch{}};
$('openBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files?.[0];if(f)loadFile(f);e.target.value=''};
function loadFile(file){if(file.size>20*1024*1024&&!confirm('This file is larger than 20 MB and may be slow. Continue?'))return;const r=new FileReader();r.onload=()=>{source.value=String(r.result||'');if(file.name.toLowerCase().endsWith('.json'))$('mode').value='jsonToTable';else $('mode').value='tableToJson';updateMode();status(`Loaded ${file.name}.`);save()};r.onerror=()=>status('Could not read the file.','err');r.readAsText(file)}
const wrap=$('sourceWrap');['dragenter','dragover'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.add('drag')}));['dragleave','drop'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.remove('drag')}));wrap.addEventListener('drop',e=>{const f=e.dataTransfer.files?.[0];if(f)loadFile(f)});
$('sourceTab').onclick=()=>{$('grid').className='grid mobile-source';$('sourceTab').classList.add('active');$('outputTab').classList.remove('active')};$('outputTab').onclick=()=>{$('grid').className='grid mobile-output';$('outputTab').classList.add('active');$('sourceTab').classList.remove('active')};
restore();updateMode();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js?v=2').catch(()=>{});
</script>
</body>
</html>
